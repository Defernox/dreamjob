[project]
name = "dreamjob-backend"
version = "0.1.0"
description = "DreamJob — API locale : agrégation d'offres, scoring, génération de candidatures"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlmodel>=0.0.22",
    "alembic>=1.13",
    "apscheduler>=3.10",
    "python-docx>=1.1",
    "docxtpl>=0.17",
    "openpyxl>=3.1",
    "anthropic>=0.40",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "rapidfuzz>=3.9",
    "pypdf>=4.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.setuptools.packages.find]
include = ["app*"]
