# ============================================================
#  DreamJob — configuration
#  Modifiable à chaud : changer les poids ne rappelle JAMAIS le LLM,
#  le score est recalculé en pur code depuis les extractions en cache.
# ============================================================

scoring:
  # Version des règles. Incrémentée à chaque changement de poids :
  # sert à repérer les offres dont le score doit être recalculé.
  version: 4
  poids:            # total attendu : 100
    competences: 35
    secteur: 25
    pays: 15
    langue: 15
    contrat: 10
  seuils:           # couleur de la pastille dans l'interface
    bon: 75         # vert   >= 75
    moyen: 50       # orange 50-74, gris en dessous
  # Une offre dont NI les competences NI le secteur ne correspondent est hors
  # cible : pays/langue/contrat sont des filtres administratifs, ils ne doivent
  # pas suffire a la faire remonter. Mettre a 100 pour desactiver ce plafond.
  plafond_hors_cible: 25

llm:
  # Deux modeles, deux usages :
  #  - extraction : appele sur CHAQUE offre (volume) -> le moins cher qui tienne la route
  #  - redaction  : import du CV et lettre de motivation (rare, enjeu fort) -> le plus capable
  # « ollama » = local et gratuit (par defaut). « anthropic » = payant, meilleure
  # qualite de lettre. Le scoring, lui, n'appelle jamais de LLM quel que soit ce reglage.
  fournisseur: ollama
  ollama_url: "http://127.0.0.1:11434"
  modele_local: "mistral:7b"
  modele_extraction: claude-sonnet-5
  modele_redaction: claude-opus-5
  # Un modele local invente plus facilement : on rejette et on regenere.
  tentatives_anti_invention: 3
  # Passe de relecture critique du brouillon. MESUREE SANS EFFET avec
  # mistral:7b : il conserve la totalite des cliches qu'on lui demande de
  # traquer, il ne sait pas s'auto-critiquer. Les formules creuses sont donc
  # detectees en pur code (lettre.py, cliches()) et nommees au modele, ce qui
  # marche. A reactiver avec un modele plus capable.
  relecture_lettre: false
  max_tokens_extraction: 1200
  max_tokens_lettre: 2000
  max_tokens_import_cv: 8000

http:
  # Respect des sources : 1 requête/seconde maximum, User-Agent explicite,
  # backoff exponentiel sur erreur, cache disque des réponses.
  requetes_par_seconde: 1.0
  timeout_secondes: 20
  tentatives_max: 4
  # L'adresse de contact vient de .env (CONTACT_EMAIL) : elle n'a rien a faire
  # dans un fichier versionne. Les sources interrogees doivent pouvoir vous
  # joindre, c'est la contrepartie normale d'un acces automatise.
  user_agent: "DreamJob/0.1 (application personnelle de recherche d'emploi)"
  cache_ttl_heures: 12

documents:
  # Met en tete du CV les experiences et competences les plus proches de l'offre.
  # A desactiver si vous preferez l'ordre chronologique strict.
  reordonner_cv: true
  ouvrir_le_dossier: true

sauvegardes:
  # Copie datee de la base a chaque ouverture, puis rotation. Zero desactive.
  a_conserver: 7

chemins:
  base_donnees: "data/dreamjob.db"
  cache: "data/cache"
  logs: "data/logs"
  modele_cv: "templates/cv_modele.docx"
  dossier_candidatures: "~/Jobscout/candidatures"

# Recherche par défaut appliquée à un scan (surchargée depuis l'interface)
candidatures:
  # Une candidature « Envoyee » et sans nouvelle depuis ce nombre de jours est
  # signalee comme a relancer. Zero desactive le rappel.
  relance_apres_jours: 15

offres:
  # Une annonce qu'aucun scan n'a revue depuis ce nombre de jours est
  # probablement retiree du site : on la signale plutot que de la supprimer,
  # car une source en panne ne doit pas faire disparaitre des offres valides.
  expiree_apres_jours: 10

recherche:
  # Un filtre trop large vaut mieux qu'un filtre trop etroit : le tri fin est
  # fait par le scoring, pas par la source.
  mots_cles:
    - "analyste risques"
  pays:
    - France
  contrats:
    - CDI
    - CDD
    - V.I.E
    - Stage
    - Alternance
  offres_max_par_source: 150

# Un connecteur desactive n'est jamais interroge.
# `remarque` consigne ce qui a ete VERIFIE (robots.txt, CGU, existence d'une API)
# le 2026-08-29 : c'est ce qui justifie qu'une source soit active ou non.
sources:
  france_travail:
    actif: true
    libelle: "France Travail"
    remarque: "API officielle Offres d'emploi v2, OAuth client credentials. Valide en reel."
  civiweb:
    actif: true
    libelle: "Civiweb (V.I.E)"
    remarque: >-
      Business France. robots.txt n'interdit que /refresh ; aucune clause sur
      l'extraction automatisee dans les mentions legales. On interroge l'endpoint
      JSON que le site utilise lui-meme, avec la cle publiee dans sa configuration
      front (surchargeable par CIVIWEB_API_KEY). Valide en reel.
  adzuna:
    actif: true
    libelle: "Adzuna"
    remarque: >-
      API publique documentee, cle gratuite. Valide en reel. Couvre 19 pays, un
      appel par pays (l'Irlande, le Luxembourg, le Portugal et les pays nordiques
      renvoient 404 : ils ne sont pas interroges). ATTENTION : l'API tronque les
      descriptions a 500 caracteres, ce qui affaiblit le critere competences du
      scoring sur cette source.
  dogfinance:
    actif: true
    libelle: "DogFinance"
    remarque: >-
      Site specialise finance (~11 000 offres, editeur Carrevolutis). robots.txt
      autorise / et publie trois sitemaps d'offres ; la seule interdiction qui
      nous concernerait est /offres?* (recherche filtree), que le connecteur
      n'utilise jamais. Aucune clause CGU sur l'extraction automatisee, les
      robots ou le moissonnage. En revanche les CGU reservent l'usage des textes
      "sans le consentement ecrit de l'Editeur", et le droit sui generis du
      producteur de base de donnees (L342-1 CPI) interdit d'extraire une partie
      substantielle : on ne rapatrie donc JAMAIS le catalogue. Les sitemaps sont
      filtres localement et seules 40 pages au plus sont ouvertes par scan
      (PLAFOND_PAGES). Ce plafond est juridique, pas technique. Limites :
      localisation absente une fois sur deux, et pas de lastmod dans les
      sitemaps (impossible de reperer les nouveautes sans ouvrir les pages).
  talent:
    actif: false
    libelle: "Talent.com"
    remarque: >-
      REFUSE. robots.txt interdit explicitement /services/api-new/search,
      /search-jobs/* et /ajax/* : il n'existe aucun acces a la recherche qui soit
      autorise. Un partenariat editeur serait necessaire.
  hellowork:
    actif: false
    libelle: "HelloWork"
    remarque: >-
      REFUSE. robots.txt interdit /fr-fr/emploi/recherche.html et toute URL
      portant une chaine de requete (Disallow: /*?), ce qui couvre la recherche.
  wttj:
    actif: false
    libelle: "Welcome to the Jungle"
    remarque: >-
      REFUSE. robots.txt interdit */jobs?query=* et toute URL avec chaine de
      requete. Pas d'API publique : leur API est reservee aux partenaires.
  apec:
    actif: false
    libelle: "APEC"
    remarque: >-
      EN ATTENTE. robots.txt n'interdit rien, mais le sitemap ne publie que des
      pages de recherche, pas les offres elles-memes, et il n'existe pas d'API
      publique documentee. Rien d'exploitable proprement pour l'instant.

planification:
  # DreamJob n'est pas un serveur : il ne tourne que quand vous l'ouvrez. Le
  # planificateur ne peut donc declencher un scan que pendant ce temps-la.
  scan_quotidien_actif: true
  heure: "07:30"
  # Filet pour une application qui n'est pas allumee en permanence : si aucun
  # scan n'a abouti depuis plus de `rattrapage_apres_heures`, on en lance un peu
  # apres le demarrage. Mettre a 0 pour desactiver.
  rattrapage_apres_heures: 20
  delai_rattrapage_secondes: 30
