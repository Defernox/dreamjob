# Sur le serveur, dans /opt/dreamjob :   docker compose up -d --build
services:
  dreamjob:
    build: .
    restart: unless-stopped
    # Les secrets (clé Anthropic, identifiants France Travail et Adzuna,
    # NTFY_SUJET, DREAMJOB_URL) sont injectés depuis .env, jamais copiés dans
    # l'image.
    env_file: .env
    environment:
      TZ: Europe/Paris
    # 127.0.0.1 uniquement : l'application n'est JAMAIS joignable depuis
    # Internet. `tailscale serve` la relaie en HTTPS, sur ton réseau privé.
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./data:/app/data                                     # base, sauvegardes, cache
      - ./templates:/app/templates:ro                        # ton modèle de CV
      - ./candidatures:/home/dreamjob/Jobscout/candidatures  # les dossiers générés
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/sante')"]
      interval: 60s
      timeout: 10s
      retries: 3
    # Le journal de Docker n'a pas de limite par défaut : la veille écrit toute
    # la journée, il aurait fini par remplir le disque. Cinq fichiers de 10 Mo,
    # soit plusieurs semaines d'historique.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
