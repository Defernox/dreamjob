# Les employeurs suivis par la source « Sites des employeurs » (connectors/employeurs).
#
# statut :
#   actif      — interrogé à chaque scan et par la veille ;
#   à_venir    — logiciel identifié, connecteur pas encore écrit ;
#   à_étudier  — site carrières ou logiciel pas encore identifié ;
#   refusé     — ne sera pas interrogé ; le motif dit pourquoi, et quand ce fut vérifié.
#
# Un employeur actif a un logiciel et l'adresse de son site sur ce logiciel.
# Avant d'en activer un : robots.txt et conditions d'utilisation (voir CLAUDE.md,
# « Sources d'offres »). Les employeurs sont repérés le 2026-09-28.

