# Les employeurs suivis par la source « Sites des employeurs » (connectors/employeurs).
#
# statut :
#   actif      — interrogé à chaque scan et par la veille ;
#   à_venir    — logiciel identifié, connecteur pas encore écrit ;
#   à_étudier  — site carrières ou logiciel pas encore identifié ;
#   refusé     — ne sera pas interrogé : ses règles ou une protection l'interdisent ; le
#                motif dit pourquoi, et quand ce fut vérifié ;
#   écarté     — étudié, rien à suivre : aucune liste d'offres publique et lisible ;
#   inclus     — ses offres arrivent déjà par un autre employeur de la liste.
#
# Un employeur actif a un logiciel et l'adresse de son site sur ce logiciel.
# Avant d'en activer un : robots.txt et conditions d'utilisation (voir CLAUDE.md,
# « Sources d'offres »). Les employeurs sont repérés le 2026-09-28.

employeurs:
  # --- banques françaises ---
  banques_francaises:
    - nom: "BNP Paribas"
      statut: "refusé"
      priorite: 1
      motif: >
        Liste des offres (group.bnpparibas) protégée contre les robots : « Access Denied
        » (Akamai) à notre User-Agent, robots.txt compris. Les fiches sont sur Avature
        (bwelcome.hr.bnpparibas), qui les autorise, mais sa recherche est désactivée :
        aucune liste accessible sans contourner une protection. Vérifié le 2026-09-28.
        Les offres de BNP continuent d'arriver par Adzuna et DogFinance.
